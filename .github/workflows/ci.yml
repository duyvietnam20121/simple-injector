name: Simple Injector - Windows Build and Tests

"on":
  push:
    branches: [main, master]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build x64 / Unit tests
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_PREFIX_PATH="${{ steps.install-qt.outputs.qt-root-dir }}"
          -DBUILD_TESTING=ON

      - name: Build application and tests
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt dependencies for unit tests
        shell: pwsh
        run: |
          windeployqt --release --no-translations --no-compiler-runtime "build/Release/SimpleInjectorTests.exe"

      - name: Run unit tests
        shell: pwsh
        run: |
          $qtBin = "${{ steps.install-qt.outputs.qt-root-dir }}/bin"
          $testDir = "$PWD/build/Release"

          # Ensure the Qt runtime and deployed plugins are visible to the test binary.
          $env:PATH = "$testDir;$qtBin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_PLUGIN_PATH = "${{ steps.install-qt.outputs.qt-root-dir }}/plugins"

          & "$testDir/SimpleInjectorTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests through CTest
        shell: pwsh
        run: |
          $qtBin = "${{ steps.install-qt.outputs.qt-root-dir }}/bin"
          $testDir = "$PWD/build/Release"

          # Same Qt runtime setup for ctest to avoid DLL/plugin lookup failures
          $env:PATH = "$testDir;$qtBin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_PLUGIN_PATH = "${{ steps.install-qt.outputs.qt-root-dir }}/plugins"

          ctest --test-dir build -C Release --output-on-failure --verbose
        env:
          QT_QPA_PLATFORM: offscreen
          QT_PLUGIN_PATH: ${{ steps.install-qt.outputs.qt-root-dir }}/plugins

      - name: Prepare portable application folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "build/Release/SimpleInjector.exe" "package/SimpleInjector.exe"
          windeployqt --release --no-translations --no-compiler-runtime --dir package "package/SimpleInjector.exe"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "package/*" -DestinationPath "Simple-Injector-windows-x64.zip" -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Injector-windows-x64
          path: Simple-Injector-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
