name: Simple Injector - Windows Build and Tests

"on":
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "resources/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "resources/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build x64 / Unit tests
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_PREFIX_PATH="${{ steps.install-qt.outputs.qt-root-dir }}"
          -DBUILD_TESTING=ON

      - name: Build application and tests
        run: cmake --build build --config Release --parallel

      - name: Run unit tests (CTest)
        shell: pwsh
        run: |
          $qtRoot = "${{ steps.install-qt.outputs.qt-root-dir }}"
          $env:PATH = "$qtRoot/bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_PLUGIN_PATH = "$qtRoot/plugins"
          ctest --test-dir build -C Release --output-on-failure

      - name: Prepare portable application folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "build/Release/SimpleInjector.exe" "package/SimpleInjector.exe"
          windeployqt --release --no-translations --no-compiler-runtime --dir package "package/SimpleInjector.exe"

      # upload-artifact tự nén thư mục, không cần Compress-Archive (tránh zip lồng zip).
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Injector-windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 14
